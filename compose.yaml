services:
  app:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    # The source tree is bind-mounted from the host. Prepare Laravel's writable
    # directories for the PHP-FPM user before serving requests.
    command:
      - /bin/sh
      - -lc
      - >-
        mkdir -p storage/framework/cache/data storage/framework/sessions
        storage/framework/views storage/logs storage/app/public bootstrap/cache
        && chown -R www-data:nogroup storage/framework storage/logs
        storage/app/public bootstrap/cache
        && find storage/framework storage/logs storage/app/public bootstrap/cache
        -type d -exec chmod 2775 {} +
        && exec php-fpm
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_network

  scheduler:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_network

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8002}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        API_PROXY_URL: http://nginx
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3002}:3000"
    depends_on:
      - nginx
    networks:
      - laravel_network
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in the project .env file}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the project .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a unique DB_PASSWORD in the project .env file}
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  postgres_data:
